[project]
name = "finfriend-ui"
version = "2025.09"
description = "FinFriend - Personal Finance AI Assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit",
    "openai",
    "pandas",
    "python-dotenv",
    "toml",
    "tabulate",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ui", "services", "pages"]
include = [
    "🏠_FinFriend.py",
    "data/*",
    "static/*",
]

[tool.uv]
dev-dependencies = []
